name: Release CoReader 0.1.3

on:
  push:
    tags: [v0.1.3]

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --registry=https://registry.npmjs.org --replace-registry-host=always --no-audit --no-fund
      - run: node --test --test-concurrency=1
      - run: npm run prepare:translation:win
      - run: npm run prepare:layout:win
      - name: Build Windows installer and portable ZIP
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (Test-Path -LiteralPath $compiler) { $env:COREADER_ISCC = $compiler }
          npm run installer:win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-Item -LiteralPath 'release/CoReader-win32-x64/CoReader.exe'
          if ($exe.VersionInfo.ProductVersion -ne '0.1.3') { throw 'Unexpected Windows version' }
          tar.exe -tf release/CoReader-0.1.3-win-x64.zip > $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        with:
          name: windows-x64
          path: |
            release/CoReader-0.1.3-Setup-win-x64.exe
            release/CoReader-0.1.3-win-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --registry=https://registry.npmjs.org --replace-registry-host=always --no-audit --no-fund
      - run: npm run prepare:translation:mac -- ${{ matrix.arch }}
      - run: npm run prepare:layout:mac
      - run: npm run package:mac -- ${{ matrix.arch }}
      - run: unzip -tq release/CoReader-0.1.3-mac-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v6
        with:
          name: mac-${{ matrix.arch }}
          path: release/CoReader-0.1.3-mac-${{ matrix.arch }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: packages
          merge-multiple: true
      - name: Publish the verified downloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=v0.1.3
          cd packages
          files=(
            CoReader-0.1.3-Setup-win-x64.exe
            CoReader-0.1.3-win-x64.zip
            CoReader-0.1.3-mac-arm64.zip
            CoReader-0.1.3-mac-x64.zip
          )
          for file in "${files[@]}"; do test -s "$file"; done
          cat > "$RUNNER_TEMP/coreader-013-notes.md" <<'EOF'
          ## CoReader 0.1.3

          - 优化 PDF 划词选区精度与液态玻璃展开动效，统一批注浮窗与翻译浮窗的开闭动画与开关交互。
          - 新增 5 款深色 PDF 页面配色（玄夜深灰、深夜靛蓝、暖墨褐纸、墨绿夜读、极夜纯黑），归并界面配色栏主题分组并新增快捷主题配色入口。
          - 支持阅读界面功能栏左右侧常驻切换、页面横向偏移滑条、目录双向滑动展开，以及打开文章后自动执行对照阅读全文翻译的设置开关。
          - 新增相册卡片（支持自定义目录图片筛选与轮播时长）与多音轨混音白噪音卡片，内置多首自然/雨声/环境音效。
          - 优化 PDF 滚动采样与侧边栏拖拽重绘性能，减少拖拽卡顿并改进离线/代理环境下的版本更新检测重定向兼容性。

          ## 下载

          - Windows x64：安装版 EXE（`CoReader-0.1.3-Setup-win-x64.exe`）或便携 ZIP（`CoReader-0.1.3-win-x64.zip`）。
          - macOS 13.3 及以上：Apple Silicon 下载 `CoReader-0.1.3-mac-arm64.zip`，Intel 下载 `CoReader-0.1.3-mac-x64.zip`。两个 ZIP 均使用临时签名，未进行 Apple 公证。
          EOF
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$draft" = true
          else
            gh release create "$tag" --draft --verify-tag --title 'CoReader 0.1.3' --notes-file "$RUNNER_TEMP/coreader-013-notes.md"
          fi
          gh release upload "$tag" "${files[@]}" --clobber
          gh release edit "$tag" --draft=false --latest
