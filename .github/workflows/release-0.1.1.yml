name: Release CoReader 0.1.1

on:
  push:
    branches: [codex/release-v0.1.1]
    tags: [v0.1.1]

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/v0.1.1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --registry=https://registry.npmjs.org --replace-registry-host=always --no-audit --no-fund
      - run: node --test --test-concurrency=1
      - run: npm run prepare:translation:win
      - run: npm run prepare:layout:win
      - name: Build Windows installer and portable ZIP
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (Test-Path -LiteralPath $compiler) { $env:COREADER_ISCC = $compiler }
          npm run installer:win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-Item -LiteralPath 'release/CoReader-win32-x64/CoReader.exe'
          if ($exe.VersionInfo.ProductVersion -ne '0.1.1') { throw 'Unexpected Windows version' }
          tar.exe -tf release/CoReader-0.1.1-win-x64.zip > $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        with:
          name: windows-x64
          path: |
            release/CoReader-0.1.1-Setup-win-x64.exe
            release/CoReader-0.1.1-win-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/v0.1.1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --registry=https://registry.npmjs.org --replace-registry-host=always --no-audit --no-fund
      - run: npm run prepare:translation:mac -- ${{ matrix.arch }}
      - run: npm run prepare:layout:mac
      - run: npm run package:mac -- ${{ matrix.arch }}
      - run: unzip -tq release/CoReader-0.1.1-mac-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v6
        with:
          name: mac-${{ matrix.arch }}
          path: release/CoReader-0.1.1-mac-${{ matrix.arch }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: packages
          merge-multiple: true
      - name: Publish the verified downloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=v0.1.1
          cd packages
          files=(
            CoReader-0.1.1-Setup-win-x64.exe
            CoReader-0.1.1-win-x64.zip
            CoReader-0.1.1-mac-arm64.zip
            CoReader-0.1.1-mac-x64.zip
          )
          for file in "${files[@]}"; do test -s "$file"; done
          cat > "$RUNNER_TEMP/coreader-011-notes.md" <<'EOF'
          ## CoReader 0.1.1

          - 优化论文库的列表、表格和封面视图，并改进论文元数据识别和摘要译文缓存。
          - 改进 PDF 对照翻译的双向段落定位、公式与图表识别、选区和截图交互。
          - 增加火山方舟、自定义 OpenAI 兼容 API 和 Kimi Code 授权。Kimi API 与 Kimi Code 共用一张卡片，WorkBuddy 通过 CodeBuddy CLI 接入。

          ## 下载

          - Windows x64：安装版 EXE 或便携 ZIP。
          - macOS 13.3 及以上：Apple Silicon 下载 arm64，Intel 下载 x64。两个 ZIP 均使用临时签名，未进行 Apple 公证。
          EOF
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$draft" = true
          else
            gh release create "$tag" --draft --verify-tag --title 'CoReader 0.1.1' --notes-file "$RUNNER_TEMP/coreader-011-notes.md"
          fi
          gh release upload "$tag" "${files[@]}" --clobber
          gh release edit "$tag" --draft=false --latest
