name: Release CoReader 0.1.2

on:
  push:
    tags: [v0.1.2]

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --registry=https://registry.npmjs.org --replace-registry-host=always --no-audit --no-fund
      - run: node --test --test-concurrency=1
      - run: npm run prepare:translation:win
      - run: npm run prepare:layout:win
      - name: Build Windows installer and portable ZIP
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (Test-Path -LiteralPath $compiler) { $env:COREADER_ISCC = $compiler }
          npm run installer:win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-Item -LiteralPath 'release/CoReader-win32-x64/CoReader.exe'
          if ($exe.VersionInfo.ProductVersion -ne '0.1.2') { throw 'Unexpected Windows version' }
          tar.exe -tf release/CoReader-0.1.2-win-x64.zip > $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        with:
          name: windows-x64
          path: |
            release/CoReader-0.1.2-Setup-win-x64.exe
            release/CoReader-0.1.2-win-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --registry=https://registry.npmjs.org --replace-registry-host=always --no-audit --no-fund
      - run: npm run prepare:translation:mac -- ${{ matrix.arch }}
      - run: npm run prepare:layout:mac
      - run: npm run package:mac -- ${{ matrix.arch }}
      - run: unzip -tq release/CoReader-0.1.2-mac-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v6
        with:
          name: mac-${{ matrix.arch }}
          path: release/CoReader-0.1.2-mac-${{ matrix.arch }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: packages
          merge-multiple: true
      - name: Publish the verified downloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=v0.1.2
          cd packages
          files=(
            CoReader-0.1.2-Setup-win-x64.exe
            CoReader-0.1.2-win-x64.zip
            CoReader-0.1.2-mac-arm64.zip
            CoReader-0.1.2-mac-x64.zip
          )
          for file in "${files[@]}"; do test -s "$file"; done
          cat > "$RUNNER_TEMP/coreader-012-notes.md" <<'EOF'
          ## CoReader 0.1.2

          - 全新液态玻璃质感与 Radix 语义配色体系，新增「晴光流彩」与「极夜流光」两套动态流光主题。
          - 模型账号连接升级为 3D 卡片环交互；统一设置页与论文库的分段控件、开关、搜索式标签选择器、圆角下拉菜单及连续圆角规范。
          - 优化阅读区功能卡片拖拽重排手感，支持吸附引导线、相邻卡片波纹避让、键盘排序与减少动态适配。
          - 统一全界面双色空状态与骨架屏设计，修复底部停靠空状态排版与划词卡片折叠动画。
          - 内置示例论文《Attention Is All You Need》与首次运行 6 步交互式新手引导，保持启动 Logo 2 秒停留展示。

          ## 下载

          - Windows x64：安装版 EXE（`CoReader-0.1.2-Setup-win-x64.exe`）或便携 ZIP（`CoReader-0.1.2-win-x64.zip`）。
          - macOS 13.3 及以上：Apple Silicon 下载 `CoReader-0.1.2-mac-arm64.zip`，Intel 下载 `CoReader-0.1.2-mac-x64.zip`。两个 ZIP 均使用临时签名，未进行 Apple 公证。
          EOF
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$draft" = true
          else
            gh release create "$tag" --draft --verify-tag --title 'CoReader 0.1.2' --notes-file "$RUNNER_TEMP/coreader-012-notes.md"
          fi
          gh release upload "$tag" "${files[@]}" --clobber
          gh release edit "$tag" --draft=false --latest
